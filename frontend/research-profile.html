<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Research Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="research-profile.css">

</head>

<body>

<div class="container">

<div class="profile-card">

<h1>🔬 Research Profile</h1>

<p>Complete your profile to get AI-powered funding recommendations.</p>

<form id="researchForm">

<div class="grid">

<div class="input-box">
<label>Full Name</label>
<input type="text" placeholder="Enter your full name" required>
</div>

<div class="input-box">
<label>Email</label>
<input type="email" placeholder="Enter your email" required>
</div>

<div class="input-box">
<label>University</label>
<input type="text" placeholder="University Name">
</div>

<div class="input-box">
<label>Department</label>
<input type="text" placeholder="Department">
</div>

<div class="input-box">
<label>Research Domain</label>
<select>

<option>Artificial Intelligence</option>
<option>Machine Learning</option>
<option>Cyber Security</option>
<option>Data Science</option>
<option>IoT</option>
<option>Blockchain</option>

</select>
</div>

<div class="input-box">
<label>Experience</label>

<select>

<option>Student</option>
<option>1-2 Years</option>
<option>3-5 Years</option>
<option>5+ Years</option>

</select>

</div>

</div>

<label>Research Interests</label>

<textarea rows="4"
placeholder="Write about your research..."></textarea>

<div class="grid">

<div class="input-box">
<label>Publications</label>
<input type="number" placeholder="0">
</div>

<div class="input-box">
<label>Patents</label>
<input type="number" placeholder="0">
</div>

<div class="input-box">
<label>Funding History</label>
<input type="text" placeholder="₹50K">
</div>

<div class="input-box">
<label>Current Project</label>
<input type="text" placeholder="Project Name">
</div>

</div>

<h2>Skills</h2>

<div class="skills">

<label><input type="checkbox"> AI</label>

<label><input type="checkbox"> ML</label>

<label><input type="checkbox"> NLP</label>

<label><input type="checkbox"> Computer Vision</label>

<label><input type="checkbox"> Data Science</label>

<label><input type="checkbox"> IoT</label>

<label><input type="checkbox"> Blockchain</label>

<label><input type="checkbox"> Cloud</label>

</div>

<div class="grid">

<div class="input-box">

<label>Upload Resume</label>

<input type="file">

</div>

<div class="input-box">

<label>Upload Research Paper</label>

<input type="file">

</div>

</div>

<div class="buttons">

<button type="submit" class="save-btn">

Save Profile

</button>

<button type="button"
class="next-btn"
onclick="window.location.href='ai-analysis.html'">

Next →

</button>

</div>

</form>

</div>

</div>

<script src="research-profile.js"></script>

</body>
</html>
